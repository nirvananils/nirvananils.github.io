# Baut die Website mit tools/build.mjs und veröffentlicht sie auf GitHub Pages.
# Der tägliche Lauf sorgt dafür, dass geplante Blog-Artikel an ihrem
# Veröffentlichungsdatum automatisch live gehen.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # 03:15 UTC = 04:15 bzw. 05:15 Uhr deutscher Zeit
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website bauen
        run: node tools/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
